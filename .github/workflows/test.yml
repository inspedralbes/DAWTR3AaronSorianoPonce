name: Testing CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codi
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Instal·lar dependències del frontend
      run: npm ci
      working-directory: ./frontend

    - name: Executar Tests
      run: npm run test
      working-directory: ./frontend

    - name: Validació de coberta de codi (opcional)
      run: npm run test:coverage || true
      working-directory: ./frontend
